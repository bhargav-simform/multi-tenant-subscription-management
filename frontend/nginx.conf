# Serves the built SPA on 5173 (matching CORS_ORIGINS' default in .env.example,
# so no CORS edit is needed for docker compose up to work out of the box).
#
# The SPA talks to api-gateway directly at VITE_API_BASE_URL (baked in at
# build time) rather than through an nginx proxy — api-gateway is already the
# one published port on the host (README §"one published port"), so there is
# nothing for this container to proxy. This nginx exists only to serve static
# files and to make client-side routing work under a hard refresh.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns every path that isn't a real file — a hard refresh on
    # /resources/<id> must still resolve to index.html, not a nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's content-hash build output) are immutable —
    # long-cache them. index.html itself is NOT cached, so a redeploy is seen
    # on the next load rather than pinned by a stale service worker-less cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
