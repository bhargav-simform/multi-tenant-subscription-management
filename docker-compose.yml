# Local stack: postgres -> migrator (one-shot) -> backend -> frontend.
#
# One backend process (Express + Prisma). No message broker and no cache: domain
# events are dispatched in-process, the logout denylist lives in Postgres, and rate
# limiting is in memory.
#
# Only the backend (3000) and frontend (5178) are published, and only on 127.0.0.1.
name: mtsm

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 40s

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # Read by docker/postgres/init.sh on first boot to create the database and roles.
      DB_NAME: ${DB_NAME:-app_db}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
    volumes:
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER} -d ${DB_NAME:-app_db}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [internal]

  # Applies prisma/migrations as app_migrator, seeds the platform admin, exits.
  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile.migrator
    restart: 'no'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      PORT: '3000'
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/api/v1/health/ready']
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [internal]

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    ports:
      - '127.0.0.1:5178:5178'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5178/']
    depends_on:
      # Not a health gate — a frontend that starts first just shows failed requests
      # until the backend is up.
      backend:
        condition: service_started

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
